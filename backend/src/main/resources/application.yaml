server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: tripbrain
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:https://spring.cloud1.mooo.com}
        username: ${SPRING_ADMIN_USERNAME:admin}
        password: ${SPRING_ADMIN_PASSWORD:admin123}
        auto-registration: true
        instance:
          service-url: ${SPRING_BOOT_SERVICE_URL:https://tripbrain.mooo.com}
          management-url: ${SPRING_BOOT_MANAGEMENT_URL:https://tripbrain.mooo.com/actuator}
          health-url: ${SPRING_BOOT_HEALTH_URL:https://tripbrain.mooo.com/actuator/health}
          prefer-ip: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY:placeholder_gemini_key}
        embedding:
          options:
            model: models/gemini-embedding-2
        chat:
          options:
            safety-settings:
              - category: HARM_CATEGORY_HATE_SPEECH
                threshold: BLOCK_LOW_AND_ABOVE
              - category: HARM_CATEGORY_HARASSMENT
                threshold: BLOCK_LOW_AND_ABOVE
              - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
                threshold: BLOCK_LOW_AND_ABOVE
              - category: HARM_CATEGORY_DANGEROUS_CONTENT
                threshold: BLOCK_LOW_AND_ABOVE

    openai:
      api-key: ${GROQ_KEY:placeholder_groq_key}
      base-url: https://api.groq.com/openai
      embedding:
        enabled: false
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.1-8b-instant}

    vectorstore:
      type: ${VECTORSTORE_TYPE:qdrant}
      qdrant:
        initialize-schema: true
      opensearch:
        uris: ${OPENSEARCH_URIS:http://localhost:9200}
        username: ${OPENSEARCH_USERNAME:}
        password: ${OPENSEARCH_PASSWORD:}
        index-name: ${OPENSEARCH_INDEX_NAME:pdf-lookup-app}
        
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tripbrain}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 6
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    show-sql: false

  sql:
    init:
      mode: never

#   sql:
#     init:
#       mode: always
#       platform: sqlite
#       separator: "^^^"
logging:
  level:
    "[org.springframework.ai.chat.client.advisor]": DEBUG

qdrant:
  host: ${QDRANT_HOST:http://localhost:6333}
  api-key: ${QDRANT_KEY:}
tavily:
  api-key: ${TAVILY_KEY:placeholder_tavily_key}

admin:
  username: admin
  email: admin@tripbrain.com
  password: $2a$10$tZp65x5j4Z6H/K56QJz31uqLd/4f7E106d391y/06c278e906c278 # BCrypt hash of "admin123"

app:
  upload:
    base-dir: uploads
  pdf:
    public-base-url: /resources  # served via Spring's resource handler
  jwt:
