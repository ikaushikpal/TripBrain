<!DOCTYPE html>
<html>

<head>
    <title>PDF AI Chat</title>
    <style>
        body {
            font-family: Arial;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        input,
        button {
            padding: 8px;
            margin: 5px;
        }

        #chat {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .user {
            color: blue;
        }

        .bot {
            color: green;
        }
    </style>
</head>

<body>

    <h2>🚀 PDF AI Chat</h2>

    <!-- LOGIN -->
    <h3>Login</h3>
    <input id="email" placeholder="Email" />
    <input id="password" placeholder="Password" type="password" />
    <button onclick="login()">Login</button>

    <p>User ID: <span id="userId">None</span></p>

    <hr>

    <!-- CREATE CONVERSATION -->
    <button onclick="createConversation()">Start New Conversation</button>
    <p>Conversation ID: <span id="conversationId">None</span></p>

    <hr>

    <!-- UPLOAD PDF -->
    <input type="file" id="file" />
    <button onclick="uploadPdf()">Upload PDF</button>

    <hr>

    <!-- CHAT -->
    <div id="chat"></div>

    <input id="message" placeholder="Ask something..." style="width:70%" />
    <button onclick="sendMessage()">Send</button>

    <hr>

    <button onclick="loadMessages()">Load Chat History</button>

    <script>

        let userId = null;
        let conversationId = null;

        // ---------------- LOGIN ----------------
        async function login() {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            const data = await res.json();
            userId = data.id;

            document.getElementById('userId').innerText = userId;
        }

        // ---------------- CREATE CONVERSATION ----------------
        async function createConversation() {
            if (!userId) return alert("Login first");

            const res = await fetch('/api/conversations/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId })
            });

            const data = await res.json();
            conversationId = data.id;

            document.getElementById('conversationId').innerText = conversationId;
        }

        // ---------------- UPLOAD PDF ----------------
        async function uploadPdf() {
            if (!conversationId) return alert("Create conversation first");

            const file = document.getElementById('file').files[0];
            if (!file) return alert("Select file");

            const formData = new FormData();
            formData.append("file", file);

            await fetch(`/api/conversations/${conversationId}/upload`, {
                method: 'POST',
                body: formData
            });

            alert("PDF uploaded!");
        }

        // ---------------- CHAT ----------------
        function addMessage(text, cls) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = cls;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const message = document.getElementById('message').value;
            if (!conversationId) return alert("Create conversation first");

            addMessage("You: " + message, "user");

            const res = await fetch(
                `/api/chat/${conversationId}?message=${encodeURIComponent(message)}`
            );

            const text = await res.text();
            addMessage("Bot: " + text, "bot");

            document.getElementById('message').value = "";
        }

        // ---------------- LOAD HISTORY ----------------
        async function loadMessages() {
            if (!conversationId) return;

            const res = await fetch(`/api/conversations/${conversationId}/messages`);
            const data = await res.json();

            const chat = document.getElementById('chat');
            chat.innerHTML = "";

            data.messages.forEach(m => {
                if (m.role === "USER") {
                    addMessage("You: " + m.content, "user");
                } else {
                    addMessage("Bot: " + m.content, "bot");
                }
            });
        }

    </script>

</body>

</html>
