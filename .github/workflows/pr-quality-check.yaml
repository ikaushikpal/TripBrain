# ==============================================================================
# Workflow Name: PR Quality Gate
# Purpose: Automatically runs formatting, linting, type checks, build, unit tests,
#          conventional commit title validation, and PR review approval checks
#          whenever a Pull Request is opened or updated targeting the 'main' branch.
# ==============================================================================
name: PR Quality Gate

# Trigger events for this workflow
on:
  # Triggers whenever a Pull Request targeting the 'main' branch is modified
  pull_request:
    branches:
      - main
    types:
      - opened            # When a new PR is created
      - synchronize       # When new commits are pushed to the PR branch
      - reopened          # When a closed PR is reopened
      - edited            # When the PR title or description is edited
      - ready_for_review  # When a draft PR is marked as ready for review

  # Triggers when a reviewer submits, edits, or dismisses a PR review
  # (Ensures approval-gate re-evaluates dynamically upon review actions)
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

# Global permissions granted to the default GITHUB_TOKEN for security
permissions:
  contents: read          # Read repository source code and commit history
  pull-requests: read     # Read PR metadata and review status

# Concurrency management: cancels outdated workflow runs for the same PR
concurrency:
  group: pr-quality-${{ github.event.pull_request.number }} # Group runs by PR number
  cancel-in-progress: true                                 # Cancel previous active runs when a new push occurs

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Validate Conventional Commit PR Title
  # Ensures PR titles follow Conventional Commits standard (e.g. feat: add feature)
  # ----------------------------------------------------------------------------
  validate-title:
    name: Validate Conventional Commit PR Title
    if: github.event.pull_request.draft == false # Skip execution if PR is in draft mode
    runs-on: ubuntu-latest
    steps:
      # Action to check PR title format against conventional commit specifications
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Formatting, Linting, Type Checking, Build & Unit Tests
  # ----------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Formatting, Linting, Build & Tests
    if: github.event.pull_request.draft == false # Skip execution if PR is in draft mode
    runs-on: ubuntu-latest

    # Set default working directory for all 'run' commands in this job
    defaults:
      run:
        working-directory: frontend/trip-brain-frontend-app

    steps:
      # Step 1: Checkout repository code to runner workspace
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime and enable npm package caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: frontend/trip-brain-frontend-app/package-lock.json

      # Step 3: Clean install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Verify code formatting with Prettier
      - name: Check formatting
        run: npx prettier --check .

      # Step 5: Run ESLint to detect code quality issues and static errors
      - name: Run ESLint
        run: npm run lint

      # Step 6: Perform static TypeScript type checking for app and test configs
      - name: Type check
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json

      # Step 7: Compile production build of the frontend application
      - name: Build frontend
        run: npm run build

      # Step 8: Execute Angular Vitest unit tests in non-watch mode
      - name: Run frontend tests
        run: npm test -- --watch=false

      # Step 9: Save code coverage and test report artifacts (runs even if tests fail)
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            frontend/trip-brain-frontend-app/coverage
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # Job 3: Backend Build, Static Analysis & Unit/Integration Tests
  # ----------------------------------------------------------------------------
  backend-quality:
    name: Backend Build & Tests
    if: github.event.pull_request.draft == false # Skip execution if PR is in draft mode
    runs-on: ubuntu-latest

    # Set default working directory for backend Gradle tasks
    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Checkout backend code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Install Java 25 Development Kit (JDK)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Step 3: Configure Gradle build action with automatic caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Verify Gradle Wrapper checksum for security integrity
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Step 5: Ensure gradlew script has executable shell permissions
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Step 6: Run Gradle check task (compilation, tests, linting)
      - name: Run backend checks and tests
        run: ./gradlew --no-daemon -PskipFrontend=true check

      # Step 7: Upload test reports and XML/HTML results as pipeline artifacts
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests
            backend/build/test-results
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # Job 4: PR Approval Gate
  # Ensures PR has at least 1 non-author approval and no active requested changes
  # ----------------------------------------------------------------------------
  approval-gate:
    name: PR Approval Gate
    if: github.event.pull_request.draft == false # Skip execution if PR is in draft mode
    runs-on: ubuntu-latest

    # Requires both frontend and backend test jobs to complete successfully first
    needs:
      - frontend-quality
      - backend-quality

    steps:
      # Verify PR has at least 1 approval and no active CHANGES_REQUESTED review.
      # Uses gh CLI + jq (both pre-installed on GitHub runners) instead of
      # actions/github-script to avoid the Node 20 deprecation warning.
      - name: Verify approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Fetch all reviews for this PR (paginated, up to 100)
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate)

          # For each reviewer keep only their most recent review state,
          # then check for CHANGES_REQUESTED and count APPROVALs.
          RESULT=$(echo "$REVIEWS" | jq -r '
            # Group reviews by reviewer login
            group_by(.user.login)
            # Keep only the last (most recent) review per reviewer
            | map({ user: .[0].user.login, state: (. | last | .state) })
            | {
                changes_requested: (map(select(.state == "CHANGES_REQUESTED")) | length),
                approvals:         (map(select(.state == "APPROVED"))          | length)
              }
          ')

          CHANGES=$(echo "$RESULT" | jq -r '.changes_requested')
          APPROVALS=$(echo "$RESULT" | jq -r '.approvals')

          echo "Active CHANGES_REQUESTED reviews : $CHANGES"
          echo "Valid approvals                  : $APPROVALS"

          if [ "$CHANGES" -gt 0 ]; then
            echo "::error::Merge blocked: there is an active CHANGES_REQUESTED review."
            exit 1
          fi

          if [ "$APPROVALS" -lt 1 ]; then
            echo "::error::Merge blocked: at least one non-author approval is required."
            exit 1
          fi

          echo "✅ Approval gate passed with $APPROVALS valid approval(s)."
