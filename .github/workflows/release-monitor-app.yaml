# ==============================================================================
# Workflow Name: Release Monitor Application Container
# Purpose: Automatically builds and pushes the multi-architecture Docker image
#          ('ikaushikpal/trip-brain-monitor-app:latest') for linux/amd64 and
#          linux/arm64 whenever changes inside 'monitor/trip-brain-monitor/' are pushed to main.
# ==============================================================================
name: Release Monitor Application Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-monitor-app
  cancel-in-progress: true

jobs:
  build-and-push-monitor:
    name: Build & Push Multi-Arch Monitor Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main semver release tag
        id: release_tag
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG=$(
            git tag --list \
              --sort=-version:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1
          )
          LATEST_TAG=${LATEST_TAG:-0.0.1}
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: monitor/trip-brain-monitor
          file: monitor/trip-brain-monitor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ikaushikpal/trip-brain-monitor-app:latest
            ikaushikpal/trip-brain-monitor-app:${{ steps.release_tag.outputs.tag }}
            ikaushikpal/trip-brain-monitor-app:v${{ steps.release_tag.outputs.tag }}
          cache-from: type=gha,scope=monitor-app
          cache-to: type=gha,mode=max,scope=monitor-app
